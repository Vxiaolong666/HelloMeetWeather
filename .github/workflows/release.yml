# ZHISHENG WEATHER TERMINAL // RELEASE CI
# 推送 v* 标签（如 v0.1-Beta1）时自动构建公共发布包并创建 GitHub Release。
# 也可在 Actions 页面用 workflow_dispatch 手动触发（使用已有标签或默认构建）。
name: Release // PUBLISH

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: assemblePublicRelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout // 检出
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build public release // 构建公共发布包
        run: ./gradlew assemblePublicRelease --no-daemon --stacktrace

      - name: Package // 重命名 APK 并生成 SHA-256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/publicRelease/app-publicRelease.apk "dist/ZhishengWeather-v${VERSION}.apk"
          sha256sum "dist/ZhishengWeather-v${VERSION}.apk" | tee dist/SHA256.txt

      - name: Release notes // 从 CHANGELOG 提取本篇
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v target="## v${VERSION}" '
            index($0, target) == 1 { capture = 1; next }
            capture && index($0, "## ") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "本次发行未在 CHANGELOG.md 中找到 v${VERSION} 章节。" > dist/release-notes.md
          fi
          cat dist/release-notes.md

      - name: Create GitHub Release // 创建发行版
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/SHA256.txt
